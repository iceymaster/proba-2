<script>
  var currentUserSession = null;
  var liveTimerInterval = null;
  var debugMessages = [];

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function reportProblem(message, error) {
    var detail = error && error.message ? ': ' + error.message : '';
    debugMessages.unshift({ time: new Date().toLocaleTimeString('hu-HU'), message: message + detail });
    debugMessages = debugMessages.slice(0, 8);
    renderDebugPanel();
  }

  function renderDebugPanel() {
    var panel = document.getElementById('debugPanel');
    if (!panel) return;
    var systemChecks = [
      'Farmkiválasztó: ' + (document.querySelector('#view-locsolas .farm-select-input') ? 'rendben' : 'hiányzik'),
      'Locsolási lista: ' + (document.getElementById('farmList') ? 'rendben' : 'hiányzik'),
      'Betöltött farmok: ' + farmsData.length + ' db'
    ];
    panel.className = 'debug-panel' + (debugMessages.length ? ' error' : '');
    panel.innerHTML = '<strong>🔍 Rendszerellenőrzés</strong><ul>' +
      systemChecks.map(function(item) { return '<li>✅ ' + escapeHtml(item) + '</li>'; }).join('') +
      (debugMessages.length ? debugMessages.map(function(item) { return '<li>❌ [' + item.time + '] ' + escapeHtml(item.message) + '</li>'; }).join('') : '<li>✅ Nem található felületi hiba.</li>') +
      '</ul>';
  }

  function toggleDebugPanel() {
    var panel = document.getElementById('debugPanel');
    if (!panel) return;
    panel.hidden = !panel.hidden;
    if (!panel.hidden) renderDebugPanel();
  }

  window.addEventListener('error', function(event) {
    reportProblem('JavaScript hiba történt', event.error || { message: event.message });
  });

  // Farm adatok dinamikus időzítővel (15 órás locsolási ciklus)
  var farmsData = [
    { id: 1, name: "[] Farming", fullName: "[] Farming (Üvegház: 1. / 14. emelet)", crop: "Málna 🍇", nextWatering: Date.now() + (1 * 3600 + 15 * 60) * 1000 },
    { id: 2, name: "Lorenzo Di Falconata", fullName: "[5636] Lorenzo Di Falconata (Üvegház: 2. / 13. emelet)", crop: "Paradicsom 🍅", nextWatering: Date.now() - 5000 }, // Lejárt / Sürgős
    { id: 3, name: "Szoker", fullName: "Szoker (Üvegház: 7. / 11. emelet) [#4]", crop: "Kender 🌿", nextWatering: Date.now() + (12 * 3600) * 1000 },
    { id: 4, name: "Carter Hill", fullName: "Carter Hill (Üvegház: 6. / 11. emelet) [#1]", crop: "Málna 🍇", nextWatering: Date.now() + (35 * 60) * 1000 },
    { id: 5, name: "Gondorek", fullName: "Gondorek (Üvegház: 5. / 1. emelet) [#1]", crop: "Kender 🌿", nextWatering: Date.now() + (8 * 3600) * 1000 },
    { id: 6, name: "Robert Forian", fullName: "Robert Forian (Üvegház: 5. / 11. emelet) [#1]", crop: "Paradicsom 🍅", nextWatering: Date.now() + (14 * 3600) * 1000 },
    { id: 7, name: "Farmok Farmja", fullName: "Farmok Farmja (Üvegház: 3. / 13. emelet)", crop: "Málna 🍇", nextWatering: Date.now() + (5 * 3600) * 1000 }
  ];

  window.addEventListener('DOMContentLoaded', function() {
    checkSession();
    renderDebugPanel();
  });

  // --- AUTHENTIKÁCIÓ ÉS MUNKAMENET ---
  function switchAuthTab(tab) {
    var tabL = document.getElementById('tabLogin');
    var tabR = document.getElementById('tabRegister');
    var formL = document.getElementById('loginForm');
    var formR = document.getElementById('registerForm');
    var msg = document.getElementById('authStatusMsg');
    if (msg) msg.style.display = 'none';

    if (tab === 'login') {
      if (tabL) tabL.classList.add('active');
      if (tabR) tabR.classList.remove('active');
      if (formL) formL.style.display = 'block';
      if (formR) formR.style.display = 'none';
    } else {
      if (tabR) tabR.classList.add('active');
      if (tabL) tabL.classList.remove('active');
      if (formR) formR.style.display = 'block';
      if (formL) formL.style.display = 'none';
    }
  }

  function handleLogin(e) {
    if (e) e.preventDefault();
    currentUserSession = { igName: "Isidro Maestro", isAdmin: true };
    localStorage.setItem('seeRpgUser', JSON.stringify(currentUserSession));
    initDashboardAfterAuth();
  }

  function handleRegister(e) {
    if (e) e.preventDefault();
    switchAuthTab('login');
  }

  function checkSession() {
    var saved = localStorage.getItem('seeRpgUser');
    if (saved) {
      try {
        currentUserSession = JSON.parse(saved);
        initDashboardAfterAuth();
        return;
      } catch(e) {}
    }
    var authModal = document.getElementById('authModal');
    var app = document.getElementById('dashboardApp');
    if (authModal) authModal.style.display = 'flex';
    if (app) app.style.display = 'none';
  }

  function logout() {
    localStorage.removeItem('seeRpgUser');
    currentUserSession = null;
    location.reload();
  }

  function initDashboardAfterAuth() {
    var authModal = document.getElementById('authModal');
    var app = document.getElementById('dashboardApp');

    if (authModal) authModal.style.display = 'none';
    if (app) app.style.display = 'flex';

    var displayEl = document.getElementById('currentUserDisplay');
    if (displayEl && currentUserSession) {
      displayEl.innerText = currentUserSession.igName + (currentUserSession.isAdmin ? ' (ADMIN)' : '');
    }

    switchTab('dashboard');
    loadDashboardData();

    // Élő másodpercenkénti számláló és FLIP animációs rendező indítása
    if (liveTimerInterval) clearInterval(liveTimerInterval);
    liveTimerInterval = setInterval(updateLiveWateringTimersAnimated, 1000);
  }

  // --- BAL OLDALI LAPVÁLTÓ FÜGGVÉNY ---
  function switchTab(tabId) {
    var titles = {
      'dashboard': '📊 Vezérlőpult & Statisztikák',
      'farms': '🏡 Farmok & Parcellák Térképe',
      'ultetes': '🌱 Új Beültetés',
      'locsolas': '💧 Locsolás Rögzítése',
      'aratas': '🚜 Betakarítás & Aratás',
      'eladas': '💰 Termény Eladás',
      'stock': '📦 Raktárkészlet & Magok',
      'alerts': '⚠️ Lejáró Bérletek',
      'workers': '👤 Munkások & Egyenlegek'
    };

    var titleEl = document.getElementById('currentTabTitle');
    if (titleEl && titles[tabId]) {
      titleEl.innerText = titles[tabId];
    }

    var navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(function(item) {
      var itemTab = item.getAttribute('data-tab');
      if (itemTab === tabId) {
        item.classList.add('active');
      } else {
        item.classList.remove('active');
      }
    });

    var tabContents = document.querySelectorAll('.tab-content');
    tabContents.forEach(function(content) {
      if (content.id === 'view-' + tabId) {
        content.classList.add('active');
        content.style.display = 'block';
      } else {
        content.classList.remove('active');
        content.style.display = 'none';
      }
    });

    updateLiveWateringTimersAnimated();
  }

  // --- ADATOK BETÖLTÉSE ÉS MEGJELENÍTÉSE ---
  function loadDashboardData() {
    var defaultData = {
      totals: { income: 13218286, cost: 23986690, profit: -10768404 },
      farms: farmsData,
      expiringAlerts: [
        { name: "Carter Hill Farmja", leaseExpireDate: "2026.08.10 19:00" },
        { name: "Robert Forian Farmja", leaseExpireDate: "2026.08.10 16:00" }
      ],
      inventory: {
        globalSeeds: { "Málna mag 🍇": 42, "Paradicsom mag 🍅": 18, "Kender mag 🌿": 60 }
      }
    };

    try {
      google.script.run
        .withSuccessHandler(function(data) {
          renderAllViews(data || defaultData);
        })
        .withFailureHandler(function(error) {
          reportProblem('A szerveradatok betöltése nem sikerült, mintaadatok láthatók', error);
          renderAllViews(defaultData);
        })
        .getDashboardStats();
    } catch(e) {
      reportProblem('A szerverkapcsolat nem indult el, mintaadatok láthatók', e);
      renderAllViews(defaultData);
    }
  }

  function renderAllViews(data) {
    if (data.farms && data.farms.length) {
      farmsData = data.farms.map(function(farm, index) {
        var existing = farmsData.find(function(item) {
          return item.name === farm.name || item.fullName === farm.fullName;
        });
        return {
          id: farm.id || (existing ? existing.id : index + 1),
          name: farm.name || (existing ? existing.name : 'Ismeretlen farm'),
          fullName: farm.fullName || farm.name || (existing ? existing.fullName : 'Ismeretlen farm'),
          crop: farm.crop || (existing ? existing.crop : '-'),
          nextWatering: existing ? existing.nextWatering : Date.now() + (15 * 3600 * 1000)
        };
      });
    }
    if (data.totals) {
      if (document.getElementById('statIncome')) document.getElementById('statIncome').innerText = Number(data.totals.income || 0).toLocaleString('hu-HU') + ' Ft';
      if (document.getElementById('statCost')) document.getElementById('statCost').innerText = Number(data.totals.cost || 0).toLocaleString('hu-HU') + ' Ft';
      if (document.getElementById('statProfit')) document.getElementById('statProfit').innerText = Number(data.totals.profit || 0).toLocaleString('hu-HU') + ' Ft';
    }

    if (data.farms && document.getElementById('badgeActiveFarms')) {
      document.getElementById('badgeActiveFarms').innerText = data.farms.length;
      populateFarmSelects(farmsData);
    }

    if (data.expiringAlerts && document.getElementById('badgeLeaseAlerts')) {
      document.getElementById('badgeLeaseAlerts').innerText = data.expiringAlerts.length;
    }

    renderRentalAlerts(data.expiringAlerts || []);
    renderStockInventory(data.inventory || {});
    renderFarmMap(data.farms || farmsData);
    renderWorkersList();
    updateLiveWateringTimersAnimated();
  }

  // --- SEGÉDFÜGGVÉNYEK ÉS IDŐ FORMÁZÁS ---
  function formatTime(ms) {
    if (ms <= 0) return "SÜRGŐS / LEJÁRT";
    var totalSeconds = Math.floor(ms / 1000);
    var hours = Math.floor(totalSeconds / 3600);
    var minutes = Math.floor((totalSeconds % 3600) / 60);
    var seconds = totalSeconds % 60;
    return hours.toString().padStart(2, '0') + ':' + minutes.toString().padStart(2, '0') + ':' + seconds.toString().padStart(2, '0');
  }

  function populateFarmSelects(farms) {
    var selects = document.querySelectorAll('.farm-select-input');
    selects.forEach(function(sel) {
      sel.innerHTML = '<option value="">-- Válassz farmot --</option>';
      farms.forEach(function(f) {
        var name = f.fullName || f.name;
        var option = document.createElement('option');
        option.value = String(f.id);
        option.textContent = name;
        option.dataset.farmName = name;
        sel.appendChild(option);
      });
    });
  }

  // --- 💧 FLIP ANIMÁCIÓS ÉLŐ DINAMIKUS LOCSOLÁSI LISTA ---
  function updateLiveWateringTimersAnimated() {
    var listContainer = document.getElementById("farmList");
    if (!listContainer) return;

    var now = Date.now();

    // 1. Régi pozíciók elmentése (First)
    var oldPositions = {};
    var existingElements = listContainer.querySelectorAll('.farm-item');
    existingElements.forEach(function(el) {
      var id = el.getAttribute('data-id');
      oldPositions[id] = el.getBoundingClientRect().top;
    });

    // 2. Sorbarendezés: a leghamarabb kiszáradó kerül az elejére
    farmsData.sort(function(a, b) {
      return (a.nextWatering - now) - (b.nextWatering - now);
    });

    // 3. Elemek frissítése és újrasorolása a DOM-ban (Last)
    farmsData.forEach(function(farm) {
      var diff = farm.nextWatering - now;
      var statusClass = "status-ok";
      var icon = "⏳ ";

      if (diff <= 0) {
        statusClass = "status-critical";
        icon = "⚠️ ";
      } else if (diff < 2 * 3600 * 1000) {
        statusClass = "status-warning";
      }

      var itemEl = listContainer.querySelector('.farm-item[data-id="' + farm.id + '"]');
      if (!itemEl) {
        itemEl = document.createElement("div");
        itemEl.className = "farm-item";
        itemEl.setAttribute("data-id", farm.id);
        listContainer.appendChild(itemEl);
      } else {
        listContainer.appendChild(itemEl);
      }

      itemEl.innerHTML = 
        '<div class="farm-info">' +
          '<span class="farm-name">' + farm.fullName + '</span>' +
          '<span class="farm-details">Növény: <b>' + farm.crop + '</b></span>' +
        '</div>' +
        '<div style="display:flex; align-items:center; gap:12px;">' +
          '<div class="timer-badge ' + statusClass + '">' + icon + formatTime(diff) + '</div>' +
          '<button type="button" class="btn-submit" style="width:auto; padding:6px 14px; margin:0; font-size:0.85rem;" onclick="selectFarmInForm(' + farm.id + ')">🎯 Kiválasztás</button>' +
        '</div>';
    });

    // 4. Smooth FLIP Animáció kiszámítása és elúsztatása (Invert & Play)
    var newElements = listContainer.querySelectorAll('.farm-item');
    newElements.forEach(function(el) {
      var id = el.getAttribute('data-id');
      var oldTop = oldPositions[id];
      
      if (oldTop !== undefined) {
        var newTop = el.getBoundingClientRect().top;
        var deltaY = oldTop - newTop;

        if (deltaY !== 0) {
          el.style.transition = 'none';
          el.style.transform = 'translateY(' + deltaY + 'px)';

          requestAnimationFrame(function() {
            requestAnimationFrame(function() {
              el.style.transition = 'transform 0.6s cubic-bezier(0.2, 1, 0.3, 1), border-color 0.3s ease, box-shadow 0.3s ease';
              el.style.transform = 'translateY(0)';
            });
          });
        }
      }
    });
  }

  // --- FARM KIVÁLASZTÁSA A FORM-BAN ---
  function selectFarmInForm(farmId) {
    var form = document.querySelector('#view-locsolas form');
    var select = form && form.querySelector('.farm-select-input');
    if (!select) {
      reportProblem('A locsolási farmválasztó nem található');
      return;
    }

    var option = Array.prototype.find.call(select.options, function(item) {
      return item.value === String(farmId);
    });

    if (!option) {
      alert('A kiválasztott farm nem található a felső listában. Frissítsd az oldalt.');
      return;
    }

    select.value = option.value;
    select.dispatchEvent(new Event('change', { bubbles: true }));
    select.focus();
    form.scrollIntoView({ behavior: 'smooth', block: 'center' });
    reportProblem('Farm kiválasztva: ' + option.textContent);
    debugMessages.shift();
    renderDebugPanel();
  }

  // --- LOCSOLÁS RÖGZÍTÉSE & 15 ÓRÁS SZÁMLÁLÓ ÚJRAINDÍTÁSA ---
  function handleTabSpecificSubmit(event, actionType) {
    if (event) event.preventDefault();
    
    var activeContent = document.querySelector('.tab-content.active');
    if (!activeContent) {
      reportProblem('Nincs megnyitott oldal a művelet rögzítéséhez');
      return;
    }

    var select = activeContent.querySelector('.farm-select-input');
    if (!select || !select.value) {
      alert("⚠️ Kérlek válassz ki egy farmot!");
      return;
    }

    var selectedId = select.value;
    var targetFarm = farmsData.find(function(f) {
      return String(f.id) === String(selectedId);
    });

    if (!targetFarm) {
      reportProblem('A kiválasztott farm nem található a locsolási listában');
      alert('❌ A kiválasztott farm nem található. Frissítsd az oldalt, majd próbáld újra.');
      return;
    }

    var form = event && event.target;
    var cropInput = form && form.querySelector('.crop-select-input');
    var saleInput = form && form.querySelector('.sale-value-input');
    var harvestInput = form && form.querySelector('.harvest-qty-input');
    var value = saleInput ? Number(saleInput.value) : 0;
    var parcels = harvestInput && harvestInput.value ? harvestInput.value : '-';

    if (actionType === 'Eladás' && value <= 0) {
      alert('⚠️ Add meg az eladás bevételét.');
      return;
    }

    var payload = {
      userName: currentUserSession ? currentUserSession.igName : 'Isidro Maestro',
      actionType: actionType,
      farmSelect: targetFarm.fullName || targetFarm.name,
      cropSelect: cropInput ? cropInput.value : targetFarm.crop || '-',
      selectedParcelsList: parcels,
      value: value,
      note: actionType === 'Locsolás' ? 'Locsolási időzítő újraindítva (15 óra)' : ''
    };

    function applySuccess(message) {
      if (actionType === 'Locsolás') {
        targetFarm.nextWatering = Date.now() + (15 * 3600 * 1000);
        updateLiveWateringTimersAnimated();
      }
      alert(message || ('✅ Művelet rögzítve: ' + actionType));
      loadDashboardData();
    }

    try {
      google.script.run
        .withSuccessHandler(applySuccess)
        .withFailureHandler(function(error) {
          reportProblem('A művelet nem menthető: ' + actionType, error);
          alert('❌ A művelet nem menthető. Nyisd meg a Hibakeresés panelt a részletekhez.');
        })
        .saveData(payload);
    } catch (error) {
      reportProblem('A szerverkapcsolat nem érhető el, a művelet nincs mentve', error);
      alert('❌ A művelet nem menthető szerverkapcsolat nélkül.');
    }
  }

  // --- EGYÉB NÉZETEK RENDERELÉSE ---
  function renderStockInventory(inv) {
    var container = document.getElementById('stockContainer');
    if (!container) return;

    var html = '<div style="padding:22px;">';
    html += '<h4 style="color:#00f3ff; margin-bottom:15px; font-size:1.1rem;">📦 Globális Mag és Termény Raktár</h4>';

    if (inv && inv.globalSeeds) {
      html += '<table style="width:100%; border-collapse:collapse; color:#f8fafc;">';
      html += '<tr style="border-bottom:1px solid rgba(255,255,255,0.1); text-align:left;"><th style="padding:10px;">Tétel / Mag</th><th style="padding:10px;">Készlet</th></tr>';
      for (var seed in inv.globalSeeds) {
        html += '<tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:10px;">' + seed + '</td><td style="padding:10px; font-weight:bold; color:#00e676;">' + inv.globalSeeds[seed] + ' db</td></tr>';
      }
      html += '</table>';
    } else {
      html += '<p style="color:#94a3b8;">Nincs megjeleníthető raktárkészlet.</p>';
    }
    html += '</div>';

    container.innerHTML = html;
  }

  function renderRentalAlerts(alerts) {
    var container = document.getElementById('rentalAlertContainer');
    if (!container) return;

    if (!alerts || alerts.length === 0) {
      container.innerHTML = '<div style="padding:20px; color:#00e676;">✅ Egyetlen bérlet sem jár le a közeljövőben.</div>';
      return;
    }

    var html = '';
    alerts.forEach(function(item) {
      var fName = item.fullName || item.name || 'Ismeretlen farm';
      var exp = item.leaseExpireDate || item.systemRentExpiry || '2026.08.15 18:00';

      html += '<div style="padding:18px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;">' +
        '<div>' +
          '<div style="font-weight:bold; color:#f8fafc; font-size:1.05rem;">🏡 ' + fName + '</div>' +
          '<div style="color:#ff0055; font-size:0.88rem; margin-top:4px;">⏰ Lejárat ideje: ' + exp + '</div>' +
        '</div>' +
        '<button type="button" class="btn-submit" style="width:auto; padding:8px 16px; margin:0;" onclick="alert(\'Bérlet meghosszabbítva!\')">➕ Meghosszabbítás</button>' +
      '</div>';
    });

    container.innerHTML = html;
  }

  function renderFarmMap(farms) {
    var mapBox = document.getElementById('farmMapContainer');
    if (!mapBox) return;

    if (farms && farms.length > 0) {
      mapBox.innerHTML = '';
      farms.forEach(function(farmObj) {
        var fName = farmObj.fullName || farmObj.name;
        var slotsHtml = '';
        
        for (var p = 1; p <= 6; p++) {
          slotsHtml += '<div style="padding:10px; background:rgba(15, 26, 48, 0.8); border-radius:8px; border:1px solid rgba(0, 243, 255, 0.2); text-align:center;">' +
            '<div style="font-size:0.75rem; color:#94a3b8;">Parcella #' + p + '</div>' +
            '<div style="font-weight:bold; color:#00f3ff; font-size:0.88rem; margin-top:4px;">Fejlődik 🌿</div>' +
          '</div>';
        }

        mapBox.innerHTML += '<div style="padding:20px; margin-bottom:16px;">' +
          '<h4 style="color:#f8fafc; margin-bottom:12px; font-size:1.05rem;">🏡 ' + fName + '</h4>' +
          '<div style="display:grid; grid-template-columns: repeat(6, 1fr); gap:10px;">' + slotsHtml + '</div>' +
        '</div>';
      });
    } else {
      mapBox.innerHTML = '<div style="color:#94a3b8;">Nincs megjeleníthető farm.</div>';
    }
  }

  function renderWorkersList() {
    var container = document.getElementById('unpaidBalancesContainer');
    if (!container) return;

    var html = '<div style="padding:20px;">';
    html += '<h4 style="color:#00f3ff; margin-bottom:12px;">👤 Regisztrált Munkások & Egyenlegek</h4>';
    html += '<p style="color:#cbd5e1; font-size:0.9rem;">A munkások egyenlegei naprakészen rögzítésre kerülnek.</p>';
    html += '</div>';

    container.innerHTML = html;
  }
  // Felülírja a régi mintalistát a valós, szerverről számolt egyenlegekkel.
  function renderWorkersList() {
    var container = document.getElementById('unpaidBalancesContainer');
    if (!container) return;
    container.innerHTML = '<div style="padding:20px; color:#94a3b8;">Munkás-egyenlegek betöltése…</div>';
    try {
      google.script.run
        .withSuccessHandler(function(workers) {
          var html = '<div style="padding:20px;"><h4 style="color:#00f3ff; margin-bottom:12px;">Munkások & fizetendő összegek</h4>';
          if (!workers || !workers.length) {
            html += '<p style="color:#00e676;">Nincs kifizetetlen munkabér.</p>';
          } else {
            workers.forEach(function(item) {
              var balance = Number(item.balance) || 0;
              html += '<div style="display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid rgba(255,255,255,.08)">' +
                '<span style="flex:1; font-weight:700;">' + escapeHtml(item.worker) + '</span>' +
                '<strong style="color:#fbbf24;">' + balance.toLocaleString('hu-HU') + ' Ft</strong>' +
                (balance > 0 ? '<button class="btn-submit" style="width:auto; padding:7px 12px; margin:0; font-size:.8rem" onclick="payWorker(' + JSON.stringify(item.worker) + ',' + balance + ')">Kifizetés</button>' : '') +
                '</div>';
            });
          }
          container.innerHTML = html + '</div>';
        })
        .withFailureHandler(function(error) {
          reportProblem('A munkás-egyenlegek nem tölthetők be', error);
          container.innerHTML = '<div style="padding:20px; color:#ff8aa8;">Nem sikerült betölteni az egyenlegeket. Nyisd meg a Hibakeresés panelt.</div>';
        })
        .getUnpaidBalancesList();
    } catch (error) {
      reportProblem('A munkás-egyenlegek szerverkapcsolata nem érhető el', error);
    }
  }

  function payWorker(worker, amount) {
    if (!confirm(worker + ' teljes egyenlegének kifizetése: ' + Number(amount).toLocaleString('hu-HU') + ' Ft?')) return;
    try {
      google.script.run
        .withSuccessHandler(function(message) { alert(message || 'Kifizetés rögzítve.'); renderWorkersList(); loadDashboardData(); })
        .withFailureHandler(function(error) { reportProblem('A kifizetés nem menthető', error); alert('A kifizetés nem menthető. Nyisd meg a Hibakeresés panelt.'); })
        .saveData({ userName: worker, workerSelect: worker, actionType: 'Kifizetés', farmSelect: '-', cropSelect: '-', selectedParcelsList: '-', value: Number(amount), note: 'Teljes egyenleg automatikus rendezése' });
    } catch (error) {
      reportProblem('A kifizetés szerverkapcsolata nem érhető el', error);
    }
  }
  var latestTimerMap = {};
  var editableFarms = [];

  function formatSeconds(seconds, emptyText) {
    if (seconds === undefined || seconds === null) return emptyText || 'Nincs aktív növény';
    if (seconds <= 0) return 'Most esedékes';
    var hours = Math.floor(seconds / 3600);
    var minutes = Math.floor((seconds % 3600) / 60);
    return hours + ' ó ' + minutes + ' p';
  }

  // Farmtérkép: az állapotok, növények és időzítők a szerver által számolt adatokból jelennek meg.
  function renderFarmMap(farms) {
    var mapBox = document.getElementById('farmMapContainer');
    if (!mapBox) return;
    editableFarms = farms || [];
    if (!editableFarms.length) { mapBox.innerHTML = '<div style="color:#94a3b8;">Nincs megjeleníthető farm.</div>'; return; }
    var html = '';
    editableFarms.forEach(function(farm, farmIndex) {
      var farmName = farm.fullName || farm.name;
      var parcels = Number(farm.parcelCount || (Number(farm.size) === 80 ? 4 : 6));
      var states = latestTimerMap[farmName] || {};
      var activeParcels = [];
      for (var p = 1; p <= parcels; p++) {
        var state = states[String(p)];
        var stateText = 'Üres';
        var color = '#94a3b8';
        var crop = '-';
        var water = 'Nincs locsolás';
        var harvest = '';
        if (state) {
          crop = state.crop || '-';
          water = state.waterTimeLeft || formatSeconds(state.waterSecLeft, 'Nincs adat');
          harvest = state.harvestTimeLeft || '';
          if (state.status === 'harvest') { stateText = 'Aratásra kész'; color = '#00e676'; }
          else if (state.status === 'water') { stateText = 'Locsolandó'; color = '#ff0055'; }
          else { stateText = 'Fejlődik'; color = '#00f3ff'; }
        }
        activeParcels.push('<div style="padding:12px; background:rgba(15,26,48,.8); border-radius:8px; border:1px solid ' + color + '; text-align:left; min-height:118px">' +
          '<div style="font-size:.75rem;color:#94a3b8">Parcella #' + p + '</div>' +
          '<div style="font-weight:800;color:' + color + ';margin:4px 0">' + stateText + '</div>' +
          '<div style="font-size:.8rem">🌱 ' + escapeHtml(crop) + '</div>' +
          '<div style="font-size:.75rem;color:#cbd5e1;margin-top:5px">💧 ' + escapeHtml(water) + '</div>' +
          (harvest ? '<div style="font-size:.75rem;color:#cbd5e1">🚜 ' + escapeHtml(harvest) + '</div>' : '') +
          '</div>');
      }
      html += '<div class="card-container" style="margin-top:0!important;margin-bottom:18px!important">' +
        '<div style="display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:12px"><div><h4 style="color:#f8fafc">🏡 ' + escapeHtml(farmName) + '</h4><div style="color:#94a3b8;font-size:.82rem">' + parcels + ' aktív parcella · Tulaj: ' + escapeHtml(farm.contactIgName || 'nincs megadva') + '</div></div>' +
        '<button type="button" class="btn-debug-toggle" onclick="openFarmEditModal(' + farmIndex + ')">Farm szerkesztése</button></div>' +
        '<div style="display:grid;grid-template-columns:repeat(' + parcels + ',minmax(130px,1fr));gap:10px">' + activeParcels.join('') + '</div></div>';
    });
    mapBox.innerHTML = html;
  }

  function openFarmEditModal(index) {
    var farm = editableFarms[index];
    var modal = document.getElementById('farmEditModal');
    if (!farm || !modal) { reportProblem('A farm szerkesztő nem nyitható meg'); return; }
    document.getElementById('editFarmId').value = farm.fullName || farm.name;
    document.getElementById('editFarmName').value = farm.fullName || farm.name;
    document.getElementById('farmEditModalSub').textContent = farm.fullName || farm.name;
    document.getElementById('editFarmOwnership').value = farm.type || 'sajat';
    document.getElementById('editGreenhouseNum').value = farm.greenhouseNum || '';
    document.getElementById('editFloorNum').value = farm.floorNum || '';
    document.getElementById('editDoorNum').value = farm.doorNum || '';
    document.getElementById('editFarmSize').value = String(farm.size || (farm.parcelCount === 4 ? 80 : 120));
    document.getElementById('editOwnerIgName').value = farm.contactIgName || '';
    document.getElementById('editRentPrice').value = farm.rentPrice || '';
    document.getElementById('editContactDiscord').value = farm.contactDiscord || '';
    document.getElementById('editContactPhone').value = farm.contactPhone || '';
    document.getElementById('editSystemRentExpiry').value = String(farm.systemRentExpiry || '').replace(' ', 'T').slice(0, 16);
    document.getElementById('editPlayerRentDueDate').value = String(farm.playerRentDueDate || '').replace(' ', 'T').slice(0, 16);
    toggleFarmOwnershipFields();
    modal.style.display = 'flex';
  }

  function closeFarmEditModal() { document.getElementById('farmEditModal').style.display = 'none'; }
  function toggleFarmOwnershipFields() {
    var rented = document.getElementById('editFarmOwnership').value === 'berelt';
    document.getElementById('ownFarmSection').style.display = rented ? 'none' : 'block';
    document.getElementById('rentedFarmSection').style.display = rented ? 'block' : 'none';
  }
  function handleSaveFarmEdit(event) {
    event.preventDefault();
    var form = document.getElementById('farmEditForm');
    var data = {};
    new FormData(form).forEach(function(value, key) { data[key] = value; });
    var status = document.getElementById('farmEditStatusMsg');
    status.style.display = 'block'; status.textContent = 'Mentés folyamatban…';
    google.script.run.withSuccessHandler(function(message) {
      status.textContent = message || 'Farmadatok elmentve.';
      loadDashboardData();
      setTimeout(closeFarmEditModal, 700);
    }).withFailureHandler(function(error) {
      reportProblem('A farmadatok mentése nem sikerült', error);
      status.textContent = 'Hiba: ' + (error.message || error);
    }).updateFarmDetails(data);
  }

  // A dashboard válaszból eltárolja a parcellák aktuális időzítő- és növényadatait.
  var previousRenderAllViews = renderAllViews;
  renderAllViews = function(data) {
    latestTimerMap = data && data.timersData && data.timersData.mapData ? data.timersData.mapData : {};
    previousRenderAllViews(data);
  };
</script>
