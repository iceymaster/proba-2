<style>
:root{
    --bg:#0f172a;
    --panel:#1e293b;
    --panel2:#111827;
    --border:#334155;

    --primary:#38bdf8;
    --green:#22c55e;
    --green-dark:#16a34a;
    --yellow:#f59e0b;
    --red:#ef4444;

    --text:#e2e8f0;
    --muted:#94a3b8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI,Tahoma,sans-serif;
    padding:20px;
}

.container{
    max-width:1800px;
    margin:auto;
    display:grid;
    grid-template-columns:550px 1fr;
    gap:20px;
    align-items:start;
}

.card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
}

.card h2{
    color:var(--primary);
    margin-bottom:20px;
    font-size:22px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    color:var(--muted);
    font-size:14px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#0b1220;
    color:white;
    font-size:15px;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:var(--primary);
}

textarea{
    resize:vertical;
}

.row{
    display:flex;
    gap:10px;
}

.row>*{
    flex:1;
}

.hidden{
    display:none;
}

button{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    border-radius:10px;
    background:var(--green);
    color:white;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:.2s;
}

button:hover{
    background:var(--green-dark);
}

.secondary{
    background:var(--primary);
}

.secondary:hover{
    filter:brightness(.9);
}

.status{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.sidebar{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.panel-title{
    color:var(--yellow);
    font-size:20px;
    margin-bottom:15px;
}

.list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.item{
    background:#0b1220;
    border-left:4px solid var(--primary);
    padding:12px;
    border-radius:8px;
}

.item-title{
    font-weight:bold;
    margin-bottom:5px;
}

.item-sub{
    font-size:13px;
    color:var(--muted);
}

.plus{
    color:#4ade80;
}

.minus{
    color:#f87171;
}

.center{
    text-align:center;
}

.grid2{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.summary-box{
    background:#0b1220;
    border-radius:10px;
    padding:12px;
    text-align:center;
}

.summary-box small{
    color:var(--muted);
}

.summary-box b{
    display:block;
    margin-top:6px;
    font-size:18px;
}

.inventory{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.inventory-item{
    background:#0b1220;
    border-left:4px solid var(--green);
    padding:10px;
    border-radius:8px;
    display:flex;
    justify-content:space-between;
}

.timer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#0b1220;
    padding:12px;
    border-left:4px solid #8b5cf6;
    border-radius:8px;
}

.parcel-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:10px;
}

.parcel{
    height:60px;
    border-radius:8px;
    background:#334155;
    border:2px solid #475569;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
    transition:.2s;
}

.parcel:hover{
    border-color:var(--primary);
}

.parcel.active{
    background:#15803d;
    border-color:var(--green);
}

@media(max-width:1200px){

.container{

grid-template-columns:1fr;

}

}
</style>
