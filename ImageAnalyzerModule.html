<script>
  // Képelemző funkció: kikeresi a kék és zöld csíkok százalékos arányát
  function analyzeFarmImage(imageElement, totalWaterHours, totalGrowHours) {
    totalWaterHours = totalWaterHours || 12;
    totalGrowHours = totalGrowHours || 24;

    var canvas = document.createElement('canvas');
    var ctx = canvas.getContext('2d');

    canvas.width = imageElement.naturalWidth || imageElement.width;
    canvas.height = imageElement.naturalHeight || imageElement.height;

    ctx.drawImage(imageElement, 0, 0);

    var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    var pixels = imgData.data;

    // Színkonstansok a játékon belüli csíkokhoz
    // Kék csík (Nedvesség): R ~ 0-80, G ~ 120-220, B ~ 200-255
    // Zöld csík (Növekedés): R ~ 50-160, G ~ 180-255, B ~ 50-120

    var bluePixelCount = 0;
    var greenPixelCount = 0;

    // Képpontok bejárása és színelemzés
    for (var i = 0; i < pixels.length; i += 4) {
      var r = pixels[i];
      var g = pixels[i + 1];
      var b = pixels[i + 2];

      // Kék csík detektálás (Nedvesség)
      if (b > 180 && g > 100 && r < 100 && (b - r) > 80) {
        bluePixelCount++;
      }
      
      // Zöld csík detektálás (Növekedés)
      if (g > 160 && r < 160 && b < 130 && (g - r) > 40) {
        greenPixelCount++;
      }
    }

    // A UI ablakban a csíkok átlagos szélessége pixelben (viszonyszámítás)
    // Megbecsüljük a csík kitöltöttségét a legszélesebb egybefüggő szakaszokból
    var waterPercent = estimateBarPercentage(ctx, canvas.width, canvas.height, 'water');
    var growPercent = estimateBarPercentage(ctx, canvas.width, canvas.height, 'grow');

    // Hátralévő idők kiszámítása másodpercekben
    var remainingWaterSec = Math.round((waterPercent / 100) * totalWaterHours * 3600);
    var remainingHarvestSec = Math.round(((100 - growPercent) / 100) * totalGrowHours * 3600);

    return {
      waterPercent: Math.round(waterPercent),
      growPercent: Math.round(growPercent),
      waterSecLeft: remainingWaterSec,
      harvestSecLeft: remainingHarvestSec
    };
  }

  function estimateBarPercentage(ctx, width, height, type) {
    // Vízszintes vonalvizsgálat a fekete menüablak régiójában
    var imgData = ctx.getImageData(0, 0, width, height);
    var data = imgData.data;

    var maxRowMatch = 0;

    for (var y = 0; y < height; y += 2) {
      var currentRowFill = 0;
      var startX = -1;
      var endX = -1;

      for (var x = 0; x < width; x += 2) {
        var idx = (y * width + x) * 4;
        var r = data[idx];
        var g = data[idx + 1];
        var b = data[idx + 2];

        var isTargetColor = false;
        if (type === 'water') {
          isTargetColor = (b > 160 && g > 100 && r < 120);
        } else if (type === 'grow') {
          isTargetColor = (g > 140 && r < 150 && b < 120 && g > r);
        }

        if (isTargetColor) {
          if (startX === -1) startX = x;
          endX = x;
          currentRowFill++;
        }
      }

      var rowWidth = endX - startX;
      if (rowWidth > maxRowMatch) {
        maxRowMatch = rowWidth;
      }
    }

    // A menüben lévő csík teljes hossza kb. 180-220px közötti a képernyőmérettől függően
    // Ha találtunk érvényes sávot, kiszámoljuk a kitöltöttség arányát
    if (maxRowMatch <= 0) return 50; // Fallback 50% ha nagyon sötét a kép

    var estimatedBarFullWidth = maxRowMatch * 1.15; // Átlagos becsült teljes csíkszélesség
    var percent = (maxRowMatch / estimatedBarFullWidth) * 100;
    return Math.min(100, Math.max(0, percent));
  }

  // Ctrl+V (Vágólap beillesztés) kezelő
  function setupClipboardImagePaste(targetParcelNum) {
    document.addEventListener('paste', function (e) {
      var items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (var index in items) {
        var item = items[index];
        if (item.kind === 'file' && item.type.indexOf('image') !== -1) {
          var blob = item.getAsFile();
          var reader = new FileReader();
          reader.onload = function (event) {
            var img = new Image();
            img.onload = function () {
              var result = analyzeFarmImage(img, 12, 24);
              alert("📸 Képelemzés sikeres!\n\n💧 Nedvesség csík: " + result.waterPercent + "%\n🌱 Növekedés csík: " + result.growPercent + "%\n\n⏱ Becsült hátralévő locsolási idő: " + formatSeconds(result.waterSecLeft) + "\n⏱ Becsült hátralévő aratási idő: " + formatSeconds(result.harvestSecLeft));
              
              // Ha meg van nyitva az edit modal, automatikusan kitölti az időket!
              if (document.getElementById('editParcelModal') && document.getElementById('editParcelModal').style.display !== 'none') {
                var wSecInput = document.getElementById('editWaterSec');
                var hSecInput = document.getElementById('editHarvestSec');
                if (wSecInput) wSecInput.value = result.waterSecLeft;
                if (hSecInput) hSecInput.value = result.harvestSecLeft;
              }
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(blob);
        }
      }
    });
  }

  // Automatikus vágólap-figyelő indítása
  setupClipboardImagePaste();
</script>
